<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Art sheet</title>
<link rel="icon" href="data:," />
<style>
  body { margin: 0; padding: 16px; font: 12px sans-serif; background: #ddd; }
  h2 { margin: 16px 0 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell .img { background: repeating-conic-gradient(#bbb 0% 25%, #eee 0% 50%) 50% / 16px 16px; outline: 1px dashed #888; }
  .tile { width: 1024px; height: 512px; background-size: 512px 512px; outline: 1px solid #333; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { CHARACTERS_ART } from '/src/art/characters.ts';
  import { ITEMS_ART } from '/src/art/items.ts';
  import { ENVIRONMENT_ART } from '/src/art/environment.ts';
  import { ICONS_ART } from '/src/art/icons.ts';
  const params = new URLSearchParams(location.search);
  const only = params.get('set');
  const sets = { characters: CHARACTERS_ART, items: ITEMS_ART, environment: ENVIRONMENT_ART, icons: ICONS_ART };
  const root = document.getElementById('root');
  for (const [name, set] of Object.entries(sets)) {
    if (only && only !== name) continue;
    const h = document.createElement('h2');
    h.textContent = `${name} (${Object.keys(set).length})`;
    root.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'grid';
    root.appendChild(grid);
    for (const [key, art] of Object.entries(set)) {
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(art.svg);
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (key.startsWith('ground_')) {
        const d = document.createElement('div');
        d.className = 'tile';
        d.style.backgroundImage = `url("${url}")`;
        cell.appendChild(d);
      } else {
        const img = document.createElement('img');
        img.className = 'img';
        img.src = url;
        img.width = art.w;
        img.height = art.h;
        cell.appendChild(img);
      }
      const label = document.createElement('div');
      label.textContent = `${key} ${art.w}x${art.h}`;
      cell.appendChild(label);
      grid.appendChild(cell);
    }
  }
  document.body.dataset.ready = '1';
</script>
</body>
</html>
